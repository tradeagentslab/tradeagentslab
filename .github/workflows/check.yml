name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: arena-data (the rehearsal test uses its snapshot script)
        uses: actions/checkout@v5
        with:
          repository: tradeagentslab/arena-data
          path: .arena-data
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: guard tests (no network)
        run: node --test guard/test/*.test.mjs
      - name: arena tests (no network)
        run: node --test arena/test/*.test.mjs
      - name: demo tests (no network)
        run: node --test demo/*.test.mjs
