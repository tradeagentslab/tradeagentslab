name: docker check
# Builds the directory image (Dockerfile) and checks it starts and lists the guard's tools.
on:
  push:
    paths: [Dockerfile, .github/workflows/docker-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t guard-demo .
      - name: tools/list over stdio
        run: |
          out=$( { printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"check","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 5; } | docker run -i --rm guard-demo )
          echo "$out"
          for t in market account place_order halt journal; do
            echo "$out" | grep -q "\"name\":\"$t\"" || { echo "missing tool: $t"; exit 1; }
          done
